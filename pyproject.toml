[project]
name = "bastion-runtime"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cohere>=5.20", "fastapi>=0.115", "httpx>=0.28", "pgvector>=0.3", "psycopg[binary]>=3.2", "pydantic-settings>=2.7", "pyjwt>=2.10", "sqlalchemy>=2.0", "uvicorn[standard]>=0.34"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
